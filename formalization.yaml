  note: Source authorship is distinct from formalization responsibility; no other author endorsement or
    new mathematical novelty is claimed. Qualified simultaneous (X,B) interpretation only; source index/sign/zero-product/clipping
    normalizations are disclosed in SOURCE-MAPPING.md. The held2012sequential extension and its X-only
    objective remain separate.
- title: Mixed-integer nonlinear optimization
  authors:
