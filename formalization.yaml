status:
  scope: Two selected interfaces describe one qualified finite simultaneous FBBT family and its bounded
    original-coordinate application. For ordered finite initial bounds, the joint real variable/row (X,B)
    theory relates Cartesian nonemptiness of every public iterate, ordered fixed boxes and feasibility
    of an independent scalar LP; conditional on a nonempty run it gives endpoint convergence, the greatest
    ordered fixed box and a unique attained entire-assignment optimum for total X+B width. The source
    application retains affine/nonlinear/integer restrictions and the unchanged objective inside a finite
    X box, with unconditional LP-infeasibility-to-bounded-source-infeasibility and separately conditional
    limit/minimizer conclusions. Ten other affine, coordinate/cutoff and retained-row interfaces remain
    unselected library material. Sequential visits and the simultaneous operator remain different procedures.
    Both variable and row intervals are clipped to the initial box; signs, zero products, empty families
    and canonical empty states persist. No graph point follows from a nonempty fixed interval box. No
    unbounded-source equivalence, nonlinear/integer propagation, rounding, finite stabilization, historical
    implementation, general presolve completeness, runtime or empirical claim is certified. The full-width
    LP result is not transferred to a variable-only objective. The simultaneous theory is a qualified
    formal interpretation of adopted Belotti–Cafieri–Lee–Liberti COCOA 2010 theory, with disclosed index/sign/zero-product/clipping
    normalizations. The thesis preprocessing survey is not the source of that LP theorem; the 2012 sequential/X-only
    account remains distinct. The source bridge applies the same family, not a second independent contribution.
    No new theorem credit or standalone editorial eligibility is established.
