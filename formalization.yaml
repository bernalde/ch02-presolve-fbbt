  - Christian Kirches
  - Sven Leyffer
  - Jeff Linderoth
  - James Luedtke
  - Ashutosh Mahajan
  type: paper
  relationship: adapts
  location: Held author manuscript with cover dated November 22, 2012 (bibliographic key Belotti2013),
