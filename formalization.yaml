version: v0.4
project:
  name: Finite affine presolve and qualified simultaneous FBBT
  description: 'The finite affine row-fold contracts and preserves the explicitly bounded full original
    model and its minimizers. Attained relaxed coordinate enclosures, closed incumbent-cutoff bounds and
    final-retained-row redundancy certificates are exposed. The distinct finite simultaneous real (X,B)
    procedure is exposed through its complete qualified theory and full source-model bridge: actual-run/fixed-state/scalar-LP
    equivalence, and conditional endpoint convergence, greatest fixed box and unique attained entire-assignment
    width optimum. LP infeasibility gives bounded-source infeasibility without assuming a nonempty run.'
  authors:
  - David E. Bernal Neira
  responsible_maintainers:
  - David E. Bernal Neira
  license: Apache-2.0
repository:
  role: substantive-development
classification:
  arxiv:
  - math.OC
  msc2020:
  - 90C11
  - 90C30
sources:
- title: Modern computational approaches to nonlinear discrete optimization and applications in process
    systems engineering
  authors:
  - David E. Bernal Neira
  type: other
  relationship: adapts
  location: CMU Ph.D. thesis2021, Chapter2, convexminlpreview.tex; see SOURCE-MAPPING.md for exact passages.
  note: 'Original thesis convexminlpreview.tex lines186–192 / printed p36 / PDF74 describes housekeeping,
    sequential FBBT, relaxed coordinate optimization and lifting context. The finite affine preservation
    route uses image extrema, signed inverse bounds and a literal finite row fold; coordinate and redundancy
    certificates make bounded subclaims precise. formal/CH02-presolve-bounds-certificate.md and formal/CH02-affine-propagation-certificate.md
    delimit prior accepted scopes. formal/CH02-fbbt-source-certificate.md binds the distinct qualified
    Belotti2010 simultaneous interpretation: final COCOA2010 printed pp71–73/PDF7–9, equations9–11 and13–34,
    with normalized row indices, sign branch and explicit zero products, clipping both(X,B). The thesis
    overview does not itself state this LP theorem. Belotti2012 sequential recurrence and X-only objective
    remain distinct. Existing certificate evidence is reused, with later Lean4.35 migration pins; no new
    source-science certification is claimed.'
