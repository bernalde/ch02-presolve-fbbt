    URL is https://www.ieor.iitb.ac.in/files/faculty/amahajan/papers/belotti2013mixed.pdf. No final-journal
    byte identity is claimed.
status:
  scope: 'The finite affine row-fold contracts and preserves the explicitly bounded full original model
    and its minimizers. Attained relaxed coordinate enclosures, closed incumbent-cutoff bounds and final-retained-row
    redundancy certificates are exposed. The distinct finite simultaneous real (X,B) procedure is exposed
    through its complete qualified theory and full source-model bridge: actual-run/fixed-state/scalar-LP
    equivalence, and conditional endpoint convergence, greatest fixed box and unique attained entire-assignment
    width optimum. LP infeasibility gives bounded-source infeasibility without assuming a nonempty run.
    Sequential visits and the simultaneous operator remain different procedures. Both variable and row
    intervals are clipped to the initial box; signs, zero products, empty families and canonical empty
    states persist. No graph point follows from a nonempty fixed interval box. No unbounded-source equivalence,
    nonlinear/integer propagation, rounding, finite stabilization, historical implementation, general
    presolve completeness, runtime or empirical claim is certified. The full-width LP result is not transferred
    to a variable-only objective.'
